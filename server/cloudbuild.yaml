steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:latest'
      - '.'
    dir: 'server'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:$SHORT_SHA'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'presold-crm-server'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/presold-crm/presold-crm-server:latest'
options:
  logging: CLOUD_LOGGING_ONLY
